<title>NAKAMA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed left nav + one working pane per page; Orbit's warm off-white, black-ink actions, bright avatar dots */
:root{
  --bg:#fafaf8; --surface:#ffffff; --sunk:#f3f1ec; --hover:#f6f4ef; --line:#ecebe6; --line2:#e4e1d9;
  --fg:#1a1a1a; --fg2:#5a554c; --muted:#9c968c; --faint:#b5b0a6; --ink:#1a1a1a; --on-ink:#ffffff;
  --grid:#e6e3db; --good:#219a55; --warn:#c98a00; --bad:#d64545; --star:#F2C94C;
  --good-bg:#e6f4ec; --warn-bg:#fbf1d9; --bad-bg:#fbe7e5;
  --shadow:rgba(30,25,15,.08); --scrim:rgba(20,18,14,.38); --tip:#1a1a1a; --on-tip:#ffffff;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1b1b19; --sunk:#252421; --hover:#22211e; --line:#2a2925; --line2:#34322d;
  --fg:#f1efe9; --fg2:#c9c4b9; --muted:#8f8a80; --faint:#6c675f; --ink:#f1efe9; --on-ink:#121211;
  --grid:#272623; --good:#4cc47f; --warn:#e8b33a; --bad:#f07070;
  --good-bg:#16291e; --warn-bg:#2d2512; --bad-bg:#311a19;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); --tip:#f1efe9; --on-tip:#121211; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1b1b19; --sunk:#252421; --hover:#22211e; --line:#2a2925; --line2:#34322d;
  --fg:#f1efe9; --fg2:#c9c4b9; --muted:#8f8a80; --faint:#6c675f; --ink:#f1efe9; --on-ink:#121211;
  --grid:#272623; --good:#4cc47f; --warn:#e8b33a; --bad:#f07070;
  --good-bg:#16291e; --warn-bg:#2d2512; --bad-bg:#311a19;
  --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); --tip:#f1efe9; --on-tip:#121211; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 14px/1.45 var(--font);overflow-x:hidden;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--faint)}
h1,h2,h3{margin:0;text-wrap:balance}

.app{min-height:100vh;display:grid;align-items:start;grid-template-columns:212px minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* sidebar */
.side{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;padding-block:18px;padding-right:16px;min-width:0}
.app::before{content:"";grid-column:1;grid-row:1;align-self:stretch;border-right:1px solid var(--line);pointer-events:none}
.side{grid-column:1;grid-row:1}
.main{grid-column:2;grid-row:1}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;border:none;background:transparent;color:var(--fg2);font-weight:650;font-size:14px;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav.on{background:var(--ink);color:var(--on-ink)}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.nav.on .count{color:var(--on-ink);opacity:.7}
.side-sp{height:18px}
.demo{margin:8px 4px 6px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:12px;color:var(--fg2);line-height:1.4}
.demo b{display:flex;align-items:center;gap:6px;color:var(--fg);font-weight:750;margin-bottom:2px}
.demo b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* main */
.main{min-width:0;position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);display:flex;align-items:center;gap:14px;padding:13px 0 13px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:7px 12px;width:min(340px,100%)}
.search svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.search input{border:none;outline:none;background:transparent;font-size:13px;font-weight:550;width:100%;min-width:0}
.kbd{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:0 5px;background:var(--surface);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.view{padding:22px 0 48px 24px}
.view.split{display:grid;grid-template-columns:272px minmax(0,1fr);padding:0;align-items:start}

/* avatar */
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:750;font-size:calc(var(--s)*.36);position:relative;overflow:visible;letter-spacing:.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.av .st{position:absolute;top:-1px;right:-1px;width:calc(var(--s)*.3);height:calc(var(--s)*.3);min-width:9px;min-height:9px;border-radius:50%;background:var(--star);border:2px solid var(--surface)}

/* cards + labels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.eyebrow{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--fg2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.dotc{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dotc.good{background:var(--good)} .dotc.warn{background:var(--warn)} .dotc.bad{background:var(--bad)} .dotc.none{background:var(--line2)}
.tag{font-size:12px;font-weight:650;padding:4px 10px;border-radius:8px;background:var(--sunk);color:var(--fg2);white-space:nowrap}
.app-b{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 5px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.03em;border:1.5px solid var(--line2);color:var(--muted)}
.app-b.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

/* dashboard */
.dash{display:grid;gap:16px;align-items:start;grid-template-columns:repeat(12,minmax(0,1fr))}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi:hover{border-color:var(--line2);background:var(--hover)}
.kpi .k-l{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .k-v{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .k-s{font-size:12px;font-weight:600;color:var(--fg2)}
.kpi .k-s.good{color:var(--good)} .kpi .k-s.warn{color:var(--warn)} .kpi .k-s.bad{color:var(--bad)}
.c7{grid-column:span 7} .c5{grid-column:span 5} .c4{grid-column:span 4} .c6{grid-column:span 6} .c8{grid-column:span 8}
.reach{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:10px;border:none;background:transparent;text-align:left;width:100%}
.rrow:hover{background:var(--hover)}
.rrow .nm{font-weight:750;font-size:14px}
.rrow .meta{font-size:12px;color:var(--muted);font-weight:600}
.rrow .grow{flex:1;min-width:0}
.rrow .over{font-size:12px;font-weight:750;color:var(--bad);white-space:nowrap}
.cols{display:flex;align-items:stretch;gap:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.ctrack{height:150px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 37.5px;background-position:0 0}
.cv{font-size:11px;font-weight:750;color:var(--fg2)}
.cb{width:72%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--ink);min-height:2px}
.cb.soft{background:var(--faint)}
.cl{font-size:11px;font-weight:650;color:var(--muted);white-space:nowrap;height:15px}
.hbars{display:flex;flex-direction:column;gap:3px}
.hb{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr) 34px;align-items:center;gap:10px;padding:6px 6px;border-radius:8px;border:none;background:transparent;text-align:left;width:100%}
.hb:hover{background:var(--hover)}
.hl{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hf{display:block;height:100%;border-radius:5px;background:var(--ink)}
.hn{font-size:12px;font-weight:750;color:var(--fg2);text-align:right}
.mini-list{display:flex;flex-direction:column;gap:2px}
.bday{display:flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:var(--sunk);flex:none;line-height:1}
.bday b{font-size:15px;font-weight:800} .bday span{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:2px}

/* filter panel */
.fp{position:sticky;top:64px;max-height:calc(100vh - 64px);overflow:auto;padding:18px 16px 40px 24px;display:flex;flex-direction:column;gap:22px;min-width:0}
.fp-top{display:flex;align-items:center;justify-content:space-between}
.fp-top h2{font-size:15px;font-weight:800}
.fp-sec{display:flex;flex-direction:column;gap:2px}
.fp-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 6px 6px;border:none;background:none;width:100%;text-align:left}
.opt{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:7px;border:none;background:transparent;width:100%;text-align:left;font-size:13px;font-weight:600;color:var(--fg2)}
.opt:hover{background:var(--hover);color:var(--fg)}
.opt .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;background:var(--surface)}
.opt.radio .bx{border-radius:50%}
.opt.on{color:var(--fg)}
.opt.on .bx{background:var(--ink);border-color:var(--ink)}
.opt.on .bx::after{content:"";width:6px;height:6px;border-radius:2px;background:var(--on-ink)}
.opt.radio.on .bx::after{border-radius:50%}
.opt .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .n{font-size:11px;font-weight:700;color:var(--faint)}
.opt.zero{opacity:.45}
.more{font-size:12px;font-weight:700;color:var(--muted);border:none;background:none;padding:4px 6px;text-align:left}
.more:hover{color:var(--fg)}

/* list */
.pane{min-width:0;border-left:1px solid var(--line);min-height:calc(100vh - 64px)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0 10px 20px}
.views{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 0 0 20px}
.vpill{font-size:13px;font-weight:650;padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--fg2)}
.vpill:hover{color:var(--fg);background:var(--hover)}
.vpill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.vpill.add{border-style:dashed;background:transparent}
.vsave{display:flex;gap:6px}
.vsave input{border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font-size:13px;background:var(--surface);width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 6px 5px 10px;border-radius:8px;background:var(--ink);color:var(--on-ink);border:none}
.fchip i{font-style:normal;opacity:.6;font-weight:600}
.fchip .x{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:11px;background:transparent;opacity:.75}
.fchip:hover .x{opacity:1}
.res{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
select.sel{border:1px solid var(--line2);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:650;background:var(--surface)}
.pop{position:relative}
.pop-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px var(--shadow);padding:8px;width:210px}
.tablewrap{overflow-x:auto;margin-left:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:20px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:var(--surface);text-align:left;font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--fg2);font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--hover)}
td.namec{color:var(--fg);font-weight:750}
.namecell{display:flex;align-items:center;gap:10px}
.rv{font-size:11px;font-weight:750;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:5px;margin-left:4px}
td.num,th.num{text-align:right}
.lastc{display:inline-flex;align-items:center;gap:7px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-weight:600}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

/* canvas */
.stage{position:relative;overflow:hidden;cursor:grab;height:clamp(520px,calc(100vh - 64px),980px);border-left:1px solid var(--line);background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:26px 26px;min-height:0}
.stage-bar{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;background:linear-gradient(var(--bg) 55%,transparent);pointer-events:none}
.stage-bar>*{pointer-events:auto}
.cb-lbl{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.cchip{font-size:13px;font-weight:650;padding:6px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--fg2)}
.cchip:hover{color:var(--fg)}
.cchip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.world{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.glabel{position:absolute;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap;animation:lblIn .4s ease both}
.glabel b{display:block;font-size:13px;font-weight:800;color:var(--fg)}
.glabel span{font-size:11px;font-weight:650;color:var(--muted)}
@keyframes lblIn{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}
.dot{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:750;font-size:14px;will-change:transform,opacity;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:opacity .25s}
.dot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.dot .st{position:absolute;top:0;right:0;width:13px;height:13px;border-radius:50%;background:var(--star);border:2px solid var(--surface)}
.zoom{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:20}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:18px;font-weight:700;color:var(--fg2);box-shadow:0 1px 3px var(--shadow)}
.legend{position:absolute;left:18px;bottom:18px;z-index:20;font-size:12px;font-weight:650;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--tip);color:var(--on-tip);font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;transform:translate(-50%,-150%);white-space:nowrap}
.scard{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:30;box-shadow:-12px 0 40px var(--shadow);display:flex;flex-direction:column;animation:cardIn .28s cubic-bezier(.2,.7,.3,1) both;cursor:default}
@keyframes cardIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.scard-body{padding:4px 26px 26px;overflow:auto;display:flex;flex-direction:column}
.xbtn{width:30px;height:30px;border-radius:8px;border:none;background:var(--sunk);font-size:14px;color:var(--fg2)}
.kv{display:flex;flex-direction:column;gap:14px}
.kv .k{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.kv .v{font-size:14px;font-weight:650;margin-top:2px;overflow-wrap:anywhere}
.hr{height:1px;background:var(--line);margin:20px 0}

/* profile */
.profile{animation:profIn .25s cubic-bezier(.2,.7,.3,1) both}
@keyframes profIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:8px;padding:12px 0 12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.pbar .sp{flex:1}
.pin{padding:28px 0 60px 24px;max-width:1180px}
.phead{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.photo-btn{position:relative;width:124px;height:124px;border-radius:50%;border:none;padding:0;flex:none;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:800;box-shadow:0 6px 20px var(--shadow)}
.photo-btn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.photo-btn .ov{position:absolute;inset:0;border-radius:50%;background:rgba(10,10,10,.5);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:750;opacity:0;transition:opacity .15s}
.photo-btn .ov svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.photo-btn:hover .ov,.photo-btn:focus-visible .ov,.photo-btn.empty .ov{opacity:1}
.photo-btn.empty .ov{background:transparent}
.photo-btn.empty .ini{opacity:0}
.ph-main{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
.name-in{font-size:32px;font-weight:800;letter-spacing:-.03em;border:1px solid transparent;border-radius:10px;background:transparent;padding:2px 8px;margin-left:-9px;width:100%;max-width:560px}
.name-in:hover{border-color:var(--line2)} .name-in:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.ph-sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:28px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.fields{display:grid;grid-template-columns:132px minmax(0,1fr);gap:2px 10px;align-items:center}
.fields label{font-size:12px;font-weight:700;color:var(--muted)}
.fin{border:1px solid transparent;border-radius:8px;background:transparent;padding:7px 9px;font-size:14px;font-weight:600;width:100%;min-width:0}
.fin:hover{border-color:var(--line2);background:var(--surface)}
.fin:focus{outline:none;border-color:var(--ink);background:var(--surface)}
select.fin{appearance:none;-webkit-appearance:none;background-image:none}
.fin.empty-v{color:var(--faint)}
.chipbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 4px}
.chipbox .tag{display:inline-flex;align-items:center;gap:4px;padding-right:5px}
.chipbox .tag button{border:none;background:none;color:var(--muted);font-size:12px;padding:0 3px}
.chipbox input{border:none;background:transparent;outline:none;font-size:13px;font-weight:600;padding:4px;min-width:90px;flex:1}
textarea.notes{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:14px;line-height:1.55;background:var(--surface);font-weight:500}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px}
.stat .k{font-size:11px;font-weight:700;color:var(--muted)}
.stat .v{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.tl{display:flex;flex-direction:column}
.tl-m{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 0 4px}
.tl-r{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;font-weight:600;color:var(--fg2)}
.tl-r .d{width:58px;color:var(--muted);font-weight:650}
.bp-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.bp-row:last-child{border-bottom:none}
.bp-row .nm{font-weight:700;font-size:13px;width:92px}
.bp-row .st2{flex:1;font-size:13px;font-weight:600;color:var(--muted)}
.bp-row .st2.on{color:var(--fg)}

/* modal */
.scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-top:min(12vh,90px)!important;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));animation:fade .18s both}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:18px;width:min(460px,100%);box-shadow:0 24px 70px var(--shadow);padding:22px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.modal-h h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 12px;border-radius:14px;border:1.5px dashed var(--line2);background:var(--bg);font-weight:750;font-size:14px}
.big:hover{border-color:var(--ink)}
.big svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.big small{font-weight:600;color:var(--muted);font-size:12px}
.drop.over{border-color:var(--ink);background:var(--hover)}
.note{font-size:13px;font-weight:600;color:var(--fg2);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.5}
.cropwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.cropwrap canvas{width:320px;height:320px;max-width:100%;border-radius:14px;touch-action:none;cursor:grab;background:var(--sunk)}
.zrow{display:flex;align-items:center;gap:10px;width:320px;max-width:100%;font-size:12px;font-weight:700;color:var(--muted)}
.zrow input{flex:1;accent-color:var(--ink)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
video.cam{width:100%;border-radius:14px;background:#000;transform:scaleX(-1);aspect-ratio:4/3;object-fit:cover}
.frm{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.frm label{font-size:12px;font-weight:700;color:var(--muted)}
.frm input{border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13px;background:var(--bg)}

/* other */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tool{text-align:left;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:150px}
.tool:hover{border-color:var(--line2);box-shadow:0 6px 20px var(--shadow)}
.tool .ic{width:38px;height:38px;border-radius:10px;background:var(--sunk);display:grid;place-items:center}
.tool .ic svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool h3{font-size:15px;font-weight:800}
.tool p{margin:0;font-size:13px;color:var(--fg2);font-weight:550;line-height:1.5}
.tool .pill{align-self:flex-start;margin-top:auto}
.tool.add{border-style:dashed;background:transparent;box-shadow:none}
.toolhead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.toolhead h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;width:200px}
.progress span{display:block;height:100%;background:var(--ink);border-radius:3px}
.matcher{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;max-width:1100px}
.chatcard{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.chatcard .nm{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sug{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%;text-align:left}
.sug:hover{border-color:var(--line2)}
.sug.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.sug .grow{flex:1;min-width:0}
.sug .nm{font-weight:750}
.sug .meta{font-size:12px;color:var(--muted);font-weight:600}
.sugs{display:flex;flex-direction:column;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts .kbd{margin-left:4px;background:transparent;border-color:currentColor;opacity:.6;color:inherit}
.queue{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.qrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg2)}
.qrow.cur{background:var(--sunk);color:var(--fg)}
.qrow .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:center}
.dupc{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.dupc .nm{font-weight:800}
.dupc .meta{font-size:12px;color:var(--muted);font-weight:600;line-height:1.6}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.month h3{font-size:14px;font-weight:800;margin-bottom:8px}
.brow{display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:8px;border:none;background:transparent;width:100%;text-align:left;font-size:13px;font-weight:650}
.brow:hover{background:var(--hover)}
.brow .d{width:22px;color:var(--muted);font-weight:750}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg2);font-weight:550}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;background:var(--tip);color:var(--on-tip);font-size:13px;font-weight:700;padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px var(--shadow);animation:fade .2s both;max-width:calc(100% - 32px)}


/* filter + sort blocks */
.fp-group{display:flex;flex-direction:column;gap:8px}
.fblock{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fblock.open{border-color:var(--line2);box-shadow:0 4px 14px var(--shadow)}
.fb-h{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 0}
.fb-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:none;background:none;text-align:left;padding:6px 4px 6px 12px}
.fb-t b{font-size:13px;font-weight:800}
.fb-t span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fb-t span.set{color:var(--fg2)}
.xs{width:26px;height:26px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-size:12px;flex:none}
.xs:hover{background:var(--sunk);color:var(--fg)}
.fb-body{padding:0 8px 10px;display:flex;flex-direction:column;gap:1px}
.fb-body .fsearch{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;background:var(--bg);margin:0 2px 6px}
.sn{width:20px;height:20px;border-radius:6px;background:var(--sunk);font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-left:10px;color:var(--fg2)}
.seg{display:flex;gap:4px;padding:0 10px 10px;flex-wrap:wrap}
.seg button{flex:1;font-size:12px;font-weight:700;padding:6px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--fg2);white-space:nowrap}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.addbtn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;border:1.5px dashed var(--line2);background:transparent;font-size:13px;font-weight:750;color:var(--fg2)}
.addbtn:hover{border-color:var(--ink);color:var(--fg)}
.menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:45;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 36px var(--shadow);padding:6px;max-height:420px;overflow:auto}
.menu .mh{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:8px 8px 4px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 8px;border-radius:7px;border:none;background:transparent;text-align:left;font-size:13px;font-weight:650}
.menu button:hover{background:var(--hover)}
.menu button i{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.hint{font-size:12px;font-weight:600;color:var(--muted);padding:2px 4px}


/* family tree */
.tree-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tree-svg path{fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round}
.tlabel{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none;animation:lblIn .5s ease both;display:flex;flex-direction:column;line-height:1.25}
.tlabel b{font-size:17px;font-weight:800;color:var(--fg)}
.tlabel span{font-size:13px;font-weight:650;color:var(--muted)}
.rowlabel{position:absolute;transform:translate(-100%,-50%);text-align:right;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap;pointer-events:none}
.cchip.add{border-style:dashed;background:transparent}
.linkbtn{border:none;background:none;padding:0;font:inherit;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
button.tag.linkbtn{padding:4px 10px;text-decoration:none;background:var(--sunk)}
button.tag.linkbtn:hover,.linkbtn:hover{color:var(--fg)}

/* canvas labels + add panel */
.dot .dlabel{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%) scale(var(--inv,1));transform-origin:50% 0;display:flex;flex-direction:column;align-items:center;white-space:nowrap;pointer-events:none;color:var(--fg);line-height:1.2;text-shadow:0 0 4px var(--bg),0 0 2px var(--bg)}
.dot .dlabel b{font-size:14px;font-weight:800}
.dot .dlabel span{font-size:11.5px;font-weight:650;color:var(--muted)}
.addpanel{position:absolute;top:0;right:0;bottom:0;width:290px;z-index:25;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;cursor:default}
.addpanel-h{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.addpanel-h h3{font-size:15px;font-weight:800}
.plist{flex:1;overflow:auto;padding:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:grab;user-select:none}
.pitem:hover{background:var(--hover)}
.pitem:active{cursor:grabbing}
.pitem .nm{font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .meta{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .grip{margin-left:auto;color:var(--faint);font-size:16px}
.stage.with-panel .zoom{right:308px}
.addopen{position:absolute;top:14px;right:18px;z-index:25;box-shadow:0 2px 8px var(--shadow)}
.stage.with-panel .stage-bar,.stage:has(.addopen) .stage-bar{padding-right:150px}
.stage.with-panel .stage-bar{padding-right:308px!important}
.droppop{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 36px var(--shadow);padding:6px;width:250px;cursor:default}
.droppop .t{font-size:12px;font-weight:750;color:var(--muted);padding:6px 8px}
.droppop button{display:block;width:100%;padding:8px;border-radius:7px;border:none;background:transparent;text-align:left;font-size:13px;font-weight:700}
.droppop button:hover{background:var(--hover)}

.famchip{display:inline-flex;align-items:center;gap:7px;padding:3px 8px 3px 3px!important}
.famchip .av{font-size:9px}

/* contact scroller */
.feedwrap{display:flex;gap:24px;align-items:flex-start;justify-content:center;--fh:clamp(520px,calc(100vh - 170px),820px)}
.feed{height:var(--fh);width:min(470px,100%);overflow-y:auto;scroll-snap-type:y mandatory;border-radius:22px;scrollbar-width:none;background:var(--ink);box-shadow:0 18px 50px var(--shadow);overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.feed:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fcard{position:relative;height:var(--fh);scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.fcard.photo{background:#111}
.fimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.78) 100%)}
.fover{position:absolute;left:0;right:76px;bottom:0;padding:22px;color:#fff}
.fover h3{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 10px}
.fover p{margin:10px 0 0;font-size:13px;font-weight:550;opacity:.85;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ffacts{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600}
.ffacts b{font-weight:800;margin-right:6px;opacity:.7}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips span{font-size:12px;font-weight:750;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px)}
.fchips.soft span{background:var(--sunk);color:var(--fg2);backdrop-filter:none}
.fchips .rvchip{background:var(--warn-bg)!important;color:var(--warn)!important}
.fcard.info{background:var(--surface)}
.fband{position:absolute;left:0;right:0;top:0;height:150px;opacity:.9}
.finfo{position:relative;padding:92px 90px 26px 26px;height:100%;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.fav{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:800;border:5px solid var(--surface);flex:none}
.finfo h3{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.flist{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.flist div{display:flex;flex-direction:column}
.flist span{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.flist b{font-size:15px;font-weight:700}
.finfo blockquote{margin:2px 0 0;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;font-weight:550;color:var(--fg2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fnophoto{margin-top:auto;font-size:12px;font-weight:650;color:var(--muted)}
.frail{position:absolute;right:12px;bottom:22px;display:flex;flex-direction:column;gap:14px;z-index:2}
.fbtn{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:0;width:58px}
.fbtn .fi{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:800;background:rgba(255,255,255,.92);color:#1a1a1a;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s}
.fbtn:hover .fi{transform:scale(1.08)}
.fbtn .fl{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:nowrap}
.fcard.info .fbtn .fi{background:var(--sunk);color:var(--fg);box-shadow:none;border:1px solid var(--line2)}
.fcard.info .fbtn .fl{color:var(--fg2);text-shadow:none}
.fbtn.on .fi,.fcard.info .fbtn.on .fi{background:var(--good);color:#fff;border-color:var(--good)}
.feedside{width:200px;padding-top:8px;display:flex;flex-direction:column;gap:8px}
.kbline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--fg2)}
#reachCount{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--sunk);color:var(--fg);font-size:11px;margin-left:4px}
.seg button.on #reachCount{background:var(--on-ink);color:var(--ink)}
@media (max-width:760px){.feedside{display:none}}

/* live */
.boot{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;text-align:center;font-size:15px;color:var(--fg2)}
.boot .brand-mark svg{width:22px;height:22px}
.demo b.live::before{background:var(--good)}

/* copy chips */
.copyrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.copyid{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--fg2);padding:5px 6px 5px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg)}
.copyid b{color:var(--fg);font-weight:800}
.copyid span{font-size:11px;font-weight:750;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--fg2)}
.copyid:hover{border-color:var(--ink)}
.copyid:hover span{background:var(--ink);color:var(--on-ink)}
.copyid.done span{background:var(--good-bg);color:var(--good)}

/* duplicate review */
.cmp{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch;max-width:1100px}
.cmp-head{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.cmp-head .nm{font-weight:800;font-size:15px}
.cmp-l{display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12px;font-weight:750;color:var(--muted);padding-left:2px}
.cmp-l .both{align-self:flex-start;font-size:11px;font-weight:750;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--fg2)}
.cmp-l .both.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cell{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:46px;padding:10px 34px 10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:13px;font-weight:650;color:var(--fg);min-width:0;overflow-wrap:anywhere}
button.cell:hover{border-color:var(--line2)}
.cell.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

let NEXT_ID=1;

function treeGone(c){const n=CV.tree&&CV.tree.nodes.find(x=>x.c.id===c.id);if(!n)return null;
  if(n.inlaw||n.depth===0)return{n,also:[]};const ids=new Set(CV.tree.nodes.map(x=>x.c.id));const out=[];
  const walk=pid=>{const p=byId(pid);const sp=p.spouse&&ids.has(p.spouse)&&p.spouse;if(sp&&!out.includes(byId(sp)))out.push(byId(sp));kidsOf([pid]).forEach(k=>{if(ids.has(k.id)&&!out.includes(k)){out.push(k);walk(k.id);}});};
  walk(c.id);return{n,also:out};}

function findDupes(){
  const norm=n=>n.toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z\s]/g,'').trim().split(/\s+/);
  const pairs=[];const list=CONTACTS;
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=norm(list[i].name),b=norm(list[j].name);if(a[0]!==b[0])continue;
    const la=a[a.length-1],lb=b[b.length-1];if(a.length<2||b.length<2)continue;
    if(la===lb||(la.length===1&&lb.startsWith(la))||(lb.length===1&&la.startsWith(lb))){const key=list[i].id+'|'+list[j].id;if(!DISMISSED.has(key))pairs.push([list[i],list[j],key]);}}
  return pairs;
}

function nameScore(a,b){
  const n=s=>s.toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z\s]/g,'').trim();
  const x=n(a),y=n(b);if(!x||!y)return 0;if(x===y)return 1;
  const tx=x.split(/\s+/),ty=y.split(/\s+/);
  if(tx[0]===ty[0]&&(tx.length===1||ty.length===1))return .72;
  const bg=s=>{const o=[];for(let i=0;i<s.length-1;i++)o.push(s.slice(i,i+2));return o;};
  const A=bg(x),B=bg(y);let m=0;const bb=B.slice();A.forEach(g=>{const k=bb.indexOf(g);if(k>=0){m++;bb.splice(k,1);}});
  return 2*m/(A.length+B.length);
}

function renderReview(){
  const R_=S.review,A=byId(R_.a),B=byId(R_.b);
  let h='<div class="toolhead"><button class="btn ghost" data-act="rv-cancel">← All duplicates</button><h2>Review duplicate</h2><span class="res">Click the side you want to keep for each row</span></div>';
  h+='<div class="cmp"><div></div>'+['a','b'].map(s=>{const c=s==='a'?A:B;return'<div class="cmp-head">'+avatar(c,44)+'<div style="flex:1;min-width:0"><div class="nm">'+esc(c.name)+'</div><div style="font-size:12px;color:var(--muted);font-weight:650">Added '+fmtDate(c.added)+' · '+c.log.length+' messages</div></div><button class="btn sm" data-act="rv-all" data-s="'+s+'">Keep all</button></div>';}).join('');
  let diffs=0;
  DF.forEach(f=>{
    if(f.sec){h+='<div class="cmp-sep">'+f.sec+'</div>';return;}
    const va=A[f.k],vb=B[f.k];
    if(isEmpty(f,va)&&isEmpty(f,vb))return;
    const choice=R_.ch[f.k];
    if(choice===undefined){h+='<div class="cmp-l">'+f.l+'</div><div class="cell same">'+showVal(f,A)+'<em>Same on both</em></div>';return;}
    const onlyOne=isEmpty(f,va)||isEmpty(f,vb);
    if(!onlyOne)diffs++;
    h+='<div class="cmp-l">'+f.l+(f.list&&!onlyOne?'<button class="both'+(choice==='both'?' on':'')+'" data-act="rv-pick" data-k="'+f.k+'" data-s="both">Keep both</button>':'')+'</div>';
    ['a','b'].forEach(s=>{const c=s==='a'?A:B;const on=choice===s||choice==='both';
      h+='<button class="cell'+(on?' on':' off')+'" data-act="rv-pick" data-k="'+f.k+'" data-s="'+s+'">'+showVal(f,c)+'</button>';});
  });
  h+='</div><div class="mergebar"><span class="msg">'+(diffs===0?'No conflicts. ':diffs===1?'1 field is different. ':diffs+' fields are different. ')+'Everything ticked is kept in one contact, and the other contact is removed.</span><button class="btn" data-act="rv-cancel">Cancel</button><button class="btn primary" data-act="rv-merge">Merge contacts</button></div>';
  return h;
}
function doMerge(){
  const R_=S.review,A=byId(R_.a),B=byId(R_.b);
  DF.forEach(f=>{if(!f.k)return;const ch=R_.ch[f.k];if(!ch||ch==='a')return;
    if(ch==='b'){A[f.k]=JSON.parse(JSON.stringify(B[f.k]));if(f.k==='photo')A.photo=B.photo;return;}
    if(f.k==='beeper')A.beeper=Object.assign({},B.beeper,A.beeper);
    else if(f.k==='log')A.log=A.log.concat(B.log).sort((x,y)=>x.d-y.d);
    else if(f.k==='notes')A.notes=A.notes+'\n\n'+B.notes;
    else A[f.k]=[...new Set([...A[f.k],...B[f.k]])];});
  A.last=A.log.length?Math.min(...A.log.map(l=>l.d)):null;A.first=A.name.split(' ')[0];
  A.added=Math.max(A.added,B.added);
  CONTACTS=CONTACTS.filter(c=>c.id!==B.id);
  if(CV.dots.has(B.id)){CV.dots.get(B.id).el.remove();CV.dots.delete(B.id);}updateDot(A);
  S.review=null;toast('Merged into '+A.name);renderOther();refreshCounts();
}
function renderDupes(){
  if(S.review&&byId(S.review.a)&&byId(S.review.b))return renderReview();
  const pairs=findDupes();
  let h='<div class="toolhead"><button class="btn ghost" data-act="tool-back">← Other</button><h2>Duplicate finder</h2><span class="res">'+pairs.length+' possible</span></div>';
  if(!pairs.length)return h+'<div class="card"><div class="empty"><b>No duplicates found</b>Names that look alike show up here.</div></div>';
  const mini=c=>'<div class="dupc">'+avatar(c,40)+'<div style="min-width:0"><div class="nm">'+esc(c.name)+'</div><div class="meta">'+esc(c.category||'No category')+' · '+esc(c.place.join(', ')||'No place')+'<br>'+esc(c.phone||'No phone')+' · '+esc(c.instagram||'No Instagram')+'<br>Last messaged '+rel(c.last).toLowerCase()+' · '+(Object.keys(c.beeper).join(', ')||'not on Beeper')+'</div></div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:12px;max-width:1000px">'+pairs.map(([a,b,k])=>'<div class="card dup">'+mini(a)+mini(b)+'<div style="display:flex;flex-direction:column;gap:6px"><button class="btn primary sm" data-act="review" data-a="'+a.id+'" data-b="'+b.id+'">Review and merge</button><button class="btn sm" data-act="notdupe" data-k="'+k+'">Not the same person</button></div></div>').join('')+'</div>';

}

function importPhotos(files){
  const msg=t=>{const el=document.getElementById('photoImportMsg');if(el)el.textContent=t;};
  const norm=x=>String(x||'').toLowerCase().replace(/\.(jpe?g|png|webp|gif|heic)$/,'').replace(/ profile photo$/,'').replace(/[^a-z0-9぀-鿿]+/g,' ').trim();
  let done=0,miss=[];const jobs=[];
  [...files].forEach(f=>{
    if(/\.json$/i.test(f.name)){jobs.push(f.text().then(t=>{const d=JSON.parse(t);(d.Photos||[]).slice(1).forEach(([id,url])=>{const c=byId(id);if(c&&url){c.photo=url;done++;}else miss.push(id);});}));return;}
    const key=norm(f.name);const c=CONTACTS.find(x=>norm(x.name)===key)||CONTACTS.find(x=>norm(x.name).split(' ')[0]===key.split(' ')[0]&&key.split(' ').length===1);
    if(!c){miss.push(f.name);return;}
    jobs.push(new Promise(res=>{const img=new Image();img.onload=()=>{const k=Math.min(img.width,img.height),cv=document.createElement('canvas');cv.width=cv.height=256;
      cv.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,256,256);let q=.85,u=cv.toDataURL('image/jpeg',q);while(u.length>45000&&q>.4){q-=.1;u=cv.toDataURL('image/jpeg',q);}
      c.photo=u;done++;URL.revokeObjectURL(img.src);res();};img.onerror=()=>{miss.push(f.name);res();};img.src=URL.createObjectURL(f);}));
  });
  Promise.all(jobs).then(()=>{syncDirty();msg('Added '+done+' photo'+(done===1?'':'s')+'.'+(miss.length?' No match for: '+miss.join(', '):''));toast('Added '+done+' photos');})
    .catch(e=>msg('Couldn\'t read that file: '+e.message));
}

function shuffleIds(){const a=CONTACTS.filter(c=>c.id!==ME).map(c=>c.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function feedOrder(){if(!S.feedOrder)S.feedOrder=shuffleIds();const have=new Set(S.feedOrder);S.feedOrder=S.feedOrder.filter(id=>byId(id));CONTACTS.forEach(c=>{if(c.id!==ME&&!have.has(c.id))S.feedOrder.push(c.id);});return S.feedOrder;}
function feedFacts(c){
  const f=[];const s=statusOf(c);
  f.push(['You last messaged',c.last==null?'Never':rel(c.last)+(c.log[0]?' on '+c.log[0].p:'')]);
  if(c.cadence!=='Not set')f.push(['Keeping in touch',c.cadence+' · '+s+(s==='Overdue'?' by '+overBy(c)+' days':'')]);
  if(c.place.length)f.push(['Met in',c.place.join(', ')]);
  if(c.network)f.push(['Network',c.network]);
  const nb=nextBday(c);if(nb!=null)f.push(['Birthday',c.birthday.d+' '+MON[c.birthday.m]+(nb<=30?' · in '+nb+' days':'')]);
  if(c.instagram)f.push(['Instagram',c.instagram]);
  return f;
}

/* ---------- routing + refresh ---------- */
const TITLES={dashboard:'Dashboard',contacts:'Contacts',canvas:'Canvas',other:'Other'};
function route(r,keepTool){
  if(!TITLES[r])r='dashboard';S.route=r;if(!keepTool&&r!=='other')S.tool=null;
  if(S.profile){S.profile=null;$('#profile').hidden=true;$('.top').hidden=false;}
  S.menu=null;window.scrollTo(0,0);
  document.querySelectorAll('.nav[data-r]').forEach(n=>n.classList.toggle('on',n.dataset.r===r));
  ['dashboard','contacts','canvas','other'].forEach(k=>$('#v-'+k).hidden=k!==r);
  $('#pageTitle').textContent=TITLES[r];
  try{if(location.hash.slice(1)!==r)history.replaceState(null,'','#'+r);}catch(e){}
  $('#tipRoot').innerHTML='';
  refresh();
}
function refresh(){
  $('#navCount').textContent=CONTACTS.length;
  $('#navTools').textContent=(CHATS.length+CONTACTS.filter(c=>c.needsReview).length)||'';
  if(LIVE)setSaving();else $('#demoLine').textContent=CONTACTS.length+' fake contacts. Connect your sheet in Settings.';
  if(S.route==='dashboard')renderDashboard();
  else if(S.route==='contacts')renderList();
  else if(S.route==='canvas')showCanvas();
  else renderOther();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(S.menu&&!e.target.closest('.pop')){S.menu=null;refresh();if(!t)return;}
  if(!t)return;const a=t.dataset.act,k=t.dataset.k;
  switch(a){
    case 'route':route(t.dataset.r);break;
    case 'open':closeModal();openProfile(t.dataset.id);break;
    case 'close-profile':closeProfile();break;
    case 'menu':S.menu=S.menu===k?null:k;refresh();break;
    case 'addfilter':{S.menu=null;let i=S.filters.findIndex(f=>f.key===k);if(i<0){S.filters.forEach(f=>f.open=false);S.filters.push({key:k,vals:new Set(),open:true,all:false,q:''});}else{S.filters.forEach((f,j)=>f.open=j===i);}refresh();break;}
    case 'fold':{const i=+t.dataset.i;const was=S.filters[i].open;S.filters.forEach(f=>f.open=false);S.filters[i].open=!was;refresh();break;}
    case 'rmfilter':S.filters.splice(+t.dataset.i,1);refresh();break;
    case 'fval':{const f=S.filters[+t.dataset.i];const v=t.dataset.v;f.vals.has(v)?f.vals.delete(v):f.vals.add(v);refresh();break;}
    case 'fall':{const f=S.filters[+t.dataset.i];f.all=!f.all;refresh();break;}
    case 'clear':S.filters=[];refresh();break;
    case 'addsort':S.menu=null;if(!S.sorts.some(x=>x.key===k))S.sorts.push({key:k,dir:0});store.set('sorts',S.sorts);refresh();break;
    case 'rmsort':S.sorts.splice(+t.dataset.i,1);store.set('sorts',S.sorts);refresh();break;
    case 'sortdir':S.sorts[+t.dataset.i].dir=+t.dataset.d;store.set('sorts',S.sorts);refresh();break;
    case 'clearsort':S.sorts=[{key:'last',dir:0}];store.set('sorts',S.sorts);refresh();break;
    case 'view':{const vw=S.views[+t.dataset.i];setFilters(vw.filters,false);if(vw.sorts){S.sorts=vw.sorts.map(x=>({...x}));store.set('sorts',S.sorts);}refresh();break;}
    case 'viewadd':S.saving=true;renderList();break;
    case 'viewcancel':S.saving=false;renderList();break;
    case 'viewsave':{const n=($('#viewName')?.value||'').trim();if(!n){toast('Give the view a name first');break;}const v={name:n,filters:S.filters.filter(f=>f.vals.size).map(f=>({key:f.key,vals:[...f.vals]})),sorts:S.sorts.map(x=>({...x}))};S.views.push(v);if(LIVE){const st=Object.assign({},v);delete st.name;enqueue(()=>api('saveNamed',{tab:'Views',name:n,settings:st}));}else{extraViews.push(v);store.set('views',extraViews);}S.saving=false;renderList();toast('Saved view "'+n+'"');break;}
    case 'col':S.cols.has(k)?S.cols.delete(k):S.cols.add(k);store.set('cols',[...S.cols]);renderList();break;
    case 'drill':setFilters([{key:k,vals:[t.dataset.v]}]);route('contacts');break;
    case 'kpi':
      if(k==='all')setFilters([]);else if(k==='30')setFilters([{key:'last',vals:[LAST_B[0],LAST_B[1]]}]);else if(k==='overdue'){setFilters([{key:'status',vals:['Overdue']}]);S.sorts=[{key:'overdue',dir:0}];}
      else if(k==='review')setFilters([{key:'review',vals:['Needs review']}]);else if(k==='nophoto')setFilters([{key:'photo',vals:['No photo']}]);else if(k==='unlinked')setFilters([{key:'beeper',vals:['Not linked']}]);
      route('contacts');break;

  setList(CATEGORIES,L['Category']);setList(RELATIONSHIPS,L['Relationship']);setList(NETWORKS,L['Network']);setList(PRIORITIES,L['Priority']);
  if(L['Cadence']&&L['Cadence'].length)CADENCES.splice(0,CADENCES.length,...L['Cadence'],'Not set');
  if(L['Messaging app']&&L['Messaging app'].length)PLATFORMS.splice(0,PLATFORMS.length,...L['Messaging app']);
  CONTACTS.forEach(c=>{if(c.category&&!CATEGORIES.includes(c.category))CATEGORIES.push(c.category);if(c.network&&!NETWORKS.includes(c.network))NETWORKS.push(c.network);if(c.platform&&!PLATFORMS.includes(c.platform))PLATFORMS.push(c.platform);});
  if(data.maps&&data.maps.length){MAPS.splice(0,MAPS.length,...data.maps.map(m=>Object.assign({group:[],filters:[],labels:[]},m)));}
  if(data.views&&data.views.length){S.views=data.views.map(v=>Object.assign({filters:[]},v));extraViews.length=0;}
  const ls=(data.settings||{})['Last Beeper sync'];SYNCINFO=ls?rel(dateToDays(ls)).toLowerCase():'';
  for(const d of CV.dots.values())d.el.remove();CV.dots.clear();CV.sig='';CV.sel=null;S.feedOrder=null;S.filters=[];S.tool=null;S.profile=null;
  snapshotAll();LIVE=true;window.__live=true;
  document.querySelector('.demo').innerHTML='<b class="live">Connected</b><span id="demoLine"></span>';setSaving();
}
function loadLive(silent){
  return api('all').then(d=>{applyLive(d);route(S.route);if(!silent)toast('Loaded '+CONTACTS.length+' contacts from your sheet');})
    .catch(e=>{toast('Couldn\'t load your sheet: '+e.message);if(!silent)throw e;});
}
function bootLive(){
  try{API.url=localStorage.getItem('nakama.url')||'';API.pin=localStorage.getItem('nakama.pin')||sessionStorage.getItem('nakama.pin')||'';}catch(e){}
  if(!API.url||!API.pin)return;
  const ov=document.createElement('div');ov.className='boot';ov.innerHTML='<div><div class="brand-mark" style="margin:0 auto 14px;width:40px;height:40px;border-radius:12px">'+$('.brand-mark').innerHTML+'</div><b>Loading your contacts…</b></div>';document.body.appendChild(ov);
  loadLive(true).finally(()=>ov.remove());
}

route((location.hash||'').slice(1)||'dashboard');
bootLive();
})();
</script>
